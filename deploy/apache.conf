# Separate HTTP virtual host. Enable proxy, proxy_http and proxy_wstunnel.
# Obtain HTTPS with: certbot --apache -d fly.donutmath.com
<VirtualHost *:80>
    ServerName fly.donutmath.com
    ProxyPreserveHost On
    ProxyPass /api/ws ws://127.0.0.1:8091/api/ws
    ProxyPassReverse /api/ws ws://127.0.0.1:8091/api/ws
    ProxyPass / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/
</VirtualHost>
